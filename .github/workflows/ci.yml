name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build OrbitDrop.slnx -c Release

      - name: Test
        run: >
          dotnet test tests/OrbitDrop.Tests -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter results.trx | Select-Object -First 1
          if ($trx) {
            [xml]$x = Get-Content $trx.FullName
            $x.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | ForEach-Object {
              $msg = ("$($_.Output.ErrorInfo.Message)" -replace "`r?`n", ' ').Trim()
              Write-Output "::error title=$($_.testName)::$msg"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/**/*.trx
