name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # WPF requires Windows; the whole solution builds here.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OrbitDrop.sln

      - name: Format check (advisory, never blocks)
        run: dotnet format OrbitDrop.sln --verify-no-changes --severity warn
        continue-on-error: true

      - name: Build
        run: dotnet build OrbitDrop.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/OrbitDrop.Tests/OrbitDrop.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      # Diagnostic artifact: uploaded even on failure so a red build is debuggable.
      # This is not the distributable; those steps below are gated on success.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/**/*.trx

      - name: Publish app (framework-dependent, win-x64)
        if: success()
        run: >
          dotnet publish src/OrbitDrop.App/OrbitDrop.App.csproj
          -c Release -r win-x64 --self-contained false
          -o publish

      - name: Compute SHA-256 of published executable
        if: success()
        shell: pwsh
        run: |
          $hash = Get-FileHash publish/OrbitDrop.exe -Algorithm SHA256
          "$($hash.Hash)  OrbitDrop.exe" | Out-File -FilePath publish/SHA256SUMS.txt -Encoding ascii
          Get-Content publish/SHA256SUMS.txt

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbitdrop-win-x64
          path: publish/**
